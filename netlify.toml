# Site statique : pas de build, la racine du dépôt est publiée telle quelle.
[build]
  publish = "."
  command = ""

# Le dossier de tests et le schéma SQL ne sont pas servis.
[[redirects]]
  from = "/tests/*"
  to = "/index.html"
  status = 404
  force = true
[[redirects]]
  from = "/supabase/*"
  to = "/index.html"
  status = 404
  force = true

# En-têtes de sécurité
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; connect-src 'self' https://*.supabase.co wss://*.supabase.co; img-src 'self' data:; style-src 'self' 'unsafe-inline'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"

# La configuration n'est jamais mise en cache, pour qu'un changement de clé soit immédiat.
[[headers]]
  for = "/config.js"
  [headers.values]
    Cache-Control = "no-cache"
